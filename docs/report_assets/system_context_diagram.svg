<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">ParkViewRT System Context Diagram</title>
  <desc id="desc">System context diagram showing users, browser dashboard, FastAPI backend, local video files, slot JSON files, YOLO model, cache files, and debug outputs.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f2937"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1d4ed8"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #475569; }
      .section-label { font: 700 18px Arial, sans-serif; fill: #334155; }
      .box-title { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 400 15px Arial, sans-serif; fill: #334155; }
      .small-text { font: 400 13px Arial, sans-serif; fill: #475569; }
      .flow-text { font: 700 13px Arial, sans-serif; fill: #1f2937; }
      .note-text { font: 400 14px Arial, sans-serif; fill: #475569; }
      .context { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 20; }
      .system { fill: #e0f2fe; stroke: #0369a1; stroke-width: 3; rx: 22; }
      .frontend { fill: #dcfce7; stroke: #16a34a; stroke-width: 2.5; rx: 16; }
      .backend { fill: #fef3c7; stroke: #d97706; stroke-width: 2.5; rx: 16; }
      .data { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; rx: 16; }
      .artifact { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; rx: 16; }
      .flow { fill: none; stroke: #1f2937; stroke-width: 2.4; marker-end: url(#arrow); }
      .flow-blue { fill: none; stroke: #1d4ed8; stroke-width: 2.4; marker-end: url(#arrowBlue); }
      .flow-dashed { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="900"/>

  <text class="title" x="700" y="58" text-anchor="middle">ParkViewRT System Context Diagram</text>
  <text class="subtitle" x="700" y="88" text-anchor="middle">Vision-based parking slot monitoring for MMU FCI and FAIE day/night videos</text>

  <rect class="context" x="40" y="125" width="1320" height="710"/>
  <text class="section-label" x="70" y="160">System Boundary and External Context</text>

  <!-- External actor -->
  <rect class="data" x="85" y="345" width="220" height="145"/>
  <text class="box-title" x="195" y="383" text-anchor="middle">User</text>
  <text class="box-text" x="195" y="416" text-anchor="middle">Student / Staff / Admin</text>
  <text class="box-text" x="195" y="444" text-anchor="middle">views parking availability</text>
  <text class="box-text" x="195" y="472" text-anchor="middle">and debug output</text>

  <!-- ParkViewRT system -->
  <rect class="system" x="380" y="230" width="600" height="380"/>
  <text class="box-title" x="680" y="270" text-anchor="middle">ParkViewRT Application</text>
  <text class="small-text" x="680" y="298" text-anchor="middle">Local web dashboard and backend processing service</text>

  <rect class="frontend" x="420" y="335" width="230" height="165"/>
  <text class="box-title" x="535" y="371" text-anchor="middle">React Dashboard</text>
  <text class="box-text" x="535" y="403" text-anchor="middle">Selects FCI / FAIE</text>
  <text class="box-text" x="535" y="428" text-anchor="middle">Selects day / night</text>
  <text class="box-text" x="535" y="453" text-anchor="middle">Plays video preview</text>
  <text class="box-text" x="535" y="478" text-anchor="middle">Displays slot status</text>

  <rect class="backend" x="720" y="335" width="220" height="165"/>
  <text class="box-title" x="830" y="371" text-anchor="middle">FastAPI Backend</text>
  <text class="box-text" x="830" y="403" text-anchor="middle">Reads video frames</text>
  <text class="box-text" x="830" y="428" text-anchor="middle">Runs YOLO detection</text>
  <text class="box-text" x="830" y="453" text-anchor="middle">Maps boxes to polygons</text>
  <text class="box-text" x="830" y="478" text-anchor="middle">Returns JSON/debug images</text>

  <!-- Data sources -->
  <rect class="data" x="1055" y="170" width="245" height="115"/>
  <text class="box-title" x="1177.5" y="207" text-anchor="middle">Local Video Files</text>
  <text class="box-text" x="1177.5" y="238" text-anchor="middle">FCI day/night</text>
  <text class="box-text" x="1177.5" y="263" text-anchor="middle">FAIE day/night</text>

  <rect class="data" x="1055" y="330" width="245" height="115"/>
  <text class="box-title" x="1177.5" y="367" text-anchor="middle">Slot JSON Files</text>
  <text class="box-text" x="1177.5" y="398" text-anchor="middle">Runtime polygons</text>
  <text class="box-text" x="1177.5" y="423" text-anchor="middle">day/night per location</text>

  <rect class="data" x="1055" y="490" width="245" height="115"/>
  <text class="box-title" x="1177.5" y="527" text-anchor="middle">YOLO Model</text>
  <text class="box-text" x="1177.5" y="558" text-anchor="middle">yolo11n.pt</text>
  <text class="box-text" x="1177.5" y="583" text-anchor="middle">vehicle detection</text>

  <!-- Outputs / generated artifacts -->
  <rect class="artifact" x="408" y="670" width="245" height="115"/>
  <text class="box-title" x="530.5" y="707" text-anchor="middle">Status Cache</text>
  <text class="box-text" x="530.5" y="738" text-anchor="middle">Generated frame results</text>
  <text class="box-text" x="530.5" y="763" text-anchor="middle">for repeated testing</text>

  <rect class="artifact" x="740" y="670" width="245" height="115"/>
  <text class="box-title" x="862.5" y="707" text-anchor="middle">Debug Outputs</text>
  <text class="box-text" x="862.5" y="738" text-anchor="middle">Overlay images showing</text>
  <text class="box-text" x="862.5" y="763" text-anchor="middle">detections and slots</text>

  <!-- Internal and external flows -->
  <path class="flow-blue" d="M305 398 C350 398, 365 398, 410 398"/>
  <text class="flow-text" x="358" y="382" text-anchor="middle">opens dashboard</text>

  <path class="flow-blue" d="M410 456 C365 456, 350 456, 305 456"/>
  <text class="flow-text" x="358" y="482" text-anchor="middle">availability view</text>

  <path class="flow" d="M650 396 C680 396, 690 396, 720 396"/>
  <text class="flow-text" x="685" y="380" text-anchor="middle">API request</text>

  <path class="flow" d="M720 460 C690 460, 680 460, 650 460"/>
  <text class="flow-text" x="685" y="486" text-anchor="middle">status response</text>

  <path class="flow" d="M940 380 C985 360, 1010 245, 1055 230"/>
  <text class="flow-text" x="1012" y="286" text-anchor="middle">frame read</text>

  <path class="flow" d="M940 405 C985 405, 1010 392, 1055 390"/>
  <text class="flow-text" x="1000" y="426" text-anchor="middle">slot polygons</text>

  <path class="flow" d="M940 452 C985 478, 1010 535, 1055 548"/>
  <text class="flow-text" x="1008" y="505" text-anchor="middle">vehicle model</text>

  <path class="flow-dashed" d="M790 500 C710 600, 620 640, 555 670"/>
  <text class="flow-text" x="646" y="630" text-anchor="middle">cache result</text>

  <path class="flow-dashed" d="M850 500 C865 565, 865 620, 865 670"/>
  <text class="flow-text" x="913" y="620" text-anchor="middle">debug overlay</text>

  <!-- API examples -->
  <rect x="130" y="660" width="230" height="90" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="small-text" x="245" y="692" text-anchor="middle">Main API examples</text>
  <text class="small-text" x="245" y="718" text-anchor="middle">/api/status/{location}/video-snapshot</text>
  <text class="small-text" x="245" y="742" text-anchor="middle">/api/debug/{location}</text>

  <!-- Note -->
  <text class="note-text" x="700" y="850" text-anchor="middle">Note: Original videos are used for analysis. Browser-safe H.264 copies are used only for video preview when needed.</text>
</svg>
