<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950" role="img" aria-labelledby="title desc">
  <title id="title">ParkViewRT Use Case Diagram</title>
  <desc id="desc">Clear use case diagram for ParkViewRT with one user actor and five main blue use cases: select parking location, select video variant, view parking status, play video preview, and refresh parking status.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #475569; }
      .boundary { fill: #ffffff; stroke: #0f766e; stroke-width: 3; rx: 24; }
      .boundary-title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .actor-label { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .actor-note { font: 400 15px Arial, sans-serif; fill: #475569; }
      .usecase { fill: #ecfeff; stroke: #0891b2; stroke-width: 2.8; }
      .usecase-text { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .usecase-small { font: 400 14px Arial, sans-serif; fill: #334155; }
      .line { fill: none; stroke: #334155; stroke-width: 2.4; }
      .include { fill: none; stroke: #64748b; stroke-width: 2.1; stroke-dasharray: 9 7; marker-end: url(#arrow); }
      .include-text { font: 700 14px Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1500" height="950"/>
  <text class="title" x="750" y="58" text-anchor="middle">ParkViewRT Use Case Diagram</text>
  <text class="subtitle" x="750" y="88" text-anchor="middle">Main user interactions in the FCI and FAIE parking dashboard</text>

  <!-- Actor -->
  <circle cx="155" cy="385" r="32" fill="none" stroke="#0f172a" stroke-width="3"/>
  <line class="line" x1="155" y1="417" x2="155" y2="515"/>
  <line class="line" x1="90" y1="456" x2="220" y2="456"/>
  <line class="line" x1="155" y1="515" x2="105" y2="600"/>
  <line class="line" x1="155" y1="515" x2="205" y2="600"/>
  <text class="actor-label" x="155" y="650" text-anchor="middle">User</text>
  <text class="actor-note" x="155" y="676" text-anchor="middle">student, staff, or tester</text>

  <!-- System boundary -->
  <rect class="boundary" x="315" y="140" width="1120" height="720"/>
  <text class="boundary-title" x="875" y="185" text-anchor="middle">ParkViewRT Parking Monitoring System</text>

  <!-- Use cases with clear spacing -->
  <ellipse class="usecase" cx="590" cy="290" rx="190" ry="65"/>
  <text class="usecase-text" x="590" y="284" text-anchor="middle">Select Parking Location</text>
  <text class="usecase-small" x="590" y="312" text-anchor="middle">FCI or FAIE</text>

  <ellipse class="usecase" cx="590" cy="500" rx="190" ry="65"/>
  <text class="usecase-text" x="590" y="494" text-anchor="middle">Select Video Variant</text>
  <text class="usecase-small" x="590" y="522" text-anchor="middle">day or night</text>

  <ellipse class="usecase" cx="590" cy="710" rx="200" ry="68"/>
  <text class="usecase-text" x="590" y="704" text-anchor="middle">View Parking Status</text>
  <text class="usecase-small" x="590" y="732" text-anchor="middle">occupied, available, occluded</text>

  <ellipse class="usecase" cx="1080" cy="320" rx="190" ry="65"/>
  <text class="usecase-text" x="1080" y="314" text-anchor="middle">Play Video Preview</text>
  <text class="usecase-small" x="1080" y="342" text-anchor="middle">show selected parking video</text>

  <ellipse class="usecase" cx="1080" cy="565" rx="200" ry="68"/>
  <text class="usecase-text" x="1080" y="559" text-anchor="middle">Refresh Parking Status</text>
  <text class="usecase-small" x="1080" y="587" text-anchor="middle">request current frame analysis</text>

  <ellipse class="usecase" cx="1080" cy="745" rx="200" ry="60"/>
  <text class="usecase-text" x="1080" y="739" text-anchor="middle">View Status Summary</text>
  <text class="usecase-small" x="1080" y="766" text-anchor="middle">total, occupied, available counts</text>

  <!-- User associations, routed with simple separated lines -->
  <path class="line" d="M225 410 C280 365, 335 318, 410 300"/>
  <path class="line" d="M225 455 C300 470, 345 488, 403 495"/>
  <path class="line" d="M225 520 C300 610, 345 690, 395 705"/>
  <path class="line" d="M225 370 C470 180, 750 210, 905 295"/>
  <path class="line" d="M225 485 C500 520, 700 545, 882 560"/>
  <path class="line" d="M225 555 C500 720, 705 745, 882 745"/>

  <!-- Include relationships, separated from actor lines -->
  <path class="include" d="M740 318 C800 335, 835 335, 890 326"/>
  <text class="include-text" x="815" y="312" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <path class="include" d="M735 520 C795 540, 835 552, 882 558"/>
  <text class="include-text" x="815" y="566" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <path class="include" d="M775 702 C815 675, 860 625, 900 594"/>
  <text class="include-text" x="842" y="668" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <path class="include" d="M1080 633 C1080 655, 1080 672, 1080 685"/>
  <text class="include-text" x="1155" y="670" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>
</svg>
